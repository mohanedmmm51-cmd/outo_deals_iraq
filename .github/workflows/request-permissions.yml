name: Request permissions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  request-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test functions/request-notifications.test.js
      - run: npm install --global firebase-tools@14.12.0
      - run: npm install
        working-directory: tools/request-rules
      - run: firebase emulators:exec --project demo-auto-deals-requests --only firestore --config firebase.json "node --test permissions.test.js"
        working-directory: tools/request-rules
