name: Firebase Deploy
# Production Firebase deploy pipeline for Auto Deals Iraq.

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'functions/**'
      - 'privacy_site/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase backend
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Firebase credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT is not configured yet. Skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --global firebase-tools

      - name: Configure Google credentials
        if: steps.credentials.outputs.configured == 'true'
        id: firebase
        shell: bash
        run: |
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          PROJECT_ID="$(jq -r '.project_id // empty' "$CREDENTIALS_FILE")"
          if [ -z "$PROJECT_ID" ]; then
            echo "Service account JSON does not contain project_id"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Install Functions dependencies
        if: steps.credentials.outputs.configured == 'true' && hashFiles('functions/package.json') != ''
        working-directory: functions
        run: npm install --omit=dev

      - name: Deploy Firestore rules and Hosting
        if: steps.credentials.outputs.configured == 'true'
        run: firebase deploy --only firestore:rules,hosting --project "${{ steps.firebase.outputs.project_id }}" --non-interactive

      - name: Detect Functions changes
        if: steps.credentials.outputs.configured == 'true' && github.event_name == 'push'
        id: functions_changed
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "${{ github.sha }}" -- functions/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Functions
        if: steps.credentials.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || steps.functions_changed.outputs.changed == 'true')
        run: firebase deploy --only functions --project "${{ steps.firebase.outputs.project_id }}" --non-interactive
