name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Test product matching and order confirmation
        run: flutter test test/offer_products_test.dart test/order_confirmation_test.dart
      - name: Build Android debug APK
        run: flutter build apk --debug -v
